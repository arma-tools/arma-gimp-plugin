name: Build

on:
  push:
    branches: [main, rust-port]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The plug-in depends on the gimp-rs bindings via `../gimp-rs`, so both
# repositories are checked out next to each other.

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    # Ubuntu only packages GIMP 2.10, Tumbleweed has GIMP 3. Rust (with
    # clippy) comes from Tumbleweed as well, rustup refuses to install in
    # container jobs ($HOME is not root's home).
    container: opensuse/tumbleweed
    steps:
      - name: Install dependencies
        run: >
          zypper --non-interactive install --no-recommends
          gcc git gzip tar pkgconf-pkg-config rust cargo
          gimp gimp-devel gimp-plugin-python3

      - uses: actions/checkout@v7
        with:
          path: arma-gimp-plugin

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/gimp-rs
          path: gimp-rs

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: arma-gimp-plugin

      - name: Build
        working-directory: arma-gimp-plugin
        run: cargo build --release

      - name: Clippy
        working-directory: arma-gimp-plugin
        run: cargo clippy -- -D warnings

      - name: Unit tests
        working-directory: arma-gimp-plugin
        run: cargo test

      - name: GIMP integration tests
        working-directory: arma-gimp-plugin
        timeout-minutes: 20
        run: tests/run-gimp-tests.sh

      # The archive contains the plug-in folder for GIMP's plug-ins directory.
      # tar keeps the executable bit, a zip artifact would not.
      - name: Package
        working-directory: arma-gimp-plugin
        run: |
          mkdir -p dist/arma-gimp-plugin
          cp target/release/arma-gimp-plugin LICENSE dist/arma-gimp-plugin/
          tar -czf dist/arma-gimp-plugin-linux-x86_64.tar.gz -C dist arma-gimp-plugin

      - uses: actions/upload-artifact@v7
        with:
          path: arma-gimp-plugin/dist/arma-gimp-plugin-linux-x86_64.tar.gz
          archive: false

  windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # GIMP on Windows is built with MSYS2 (UCRT64), the plug-in links against
      # the same libraries.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git zip
          pacboy: >-
            gcc:p
            gimp:p
            pkgconf:p
            rust:p

      - uses: actions/checkout@v7
        with:
          path: arma-gimp-plugin

      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/gimp-rs
          path: gimp-rs

      - name: Build
        working-directory: arma-gimp-plugin
        run: cargo build --release

      - name: Unit tests
        working-directory: arma-gimp-plugin
        run: cargo test

      - name: Package
        working-directory: arma-gimp-plugin
        run: |
          mkdir -p dist/arma-gimp-plugin
          cp target/release/arma-gimp-plugin.exe LICENSE dist/arma-gimp-plugin/
          cd dist && zip -r arma-gimp-plugin-windows-x86_64.zip arma-gimp-plugin

      - uses: actions/upload-artifact@v7
        with:
          path: arma-gimp-plugin/dist/arma-gimp-plugin-windows-x86_64.zip
          archive: false

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history and tags, for the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          pattern: arma-gimp-plugin-*
          path: dist
          merge-multiple: true
          # The artifacts are the release archives themselves, keep the zip.
          skip-decompress: true

      - name: Release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range=${previous:+$previous..}$TAG
          {
            echo "## Changes"
            echo
            git log --no-merges --format='- %s (%h)' "$range"
            if [ -n "$previous" ]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$TAG"
            fi
          } > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create "$TAG" dist/*
          --verify-tag --title "$TAG" --notes-file notes.md
