name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt install -y pkg-config cmake
        sudo apt install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntuhandbook1/gimp-3
        sudo apt install -y gimp libgimp-3.0-0 libgimp-3.0-dev

    - name: Configure CMake
      run: >
        cmake 
        -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} 
        -DCMAKE_C_COMPILER:FILEPATH=clang 
        -DCMAKE_CXX_COMPILER:FILEPATH=clang++ 
        -S "${{ github.workspace }}"
        -B "${{ github.workspace }}/build/"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

