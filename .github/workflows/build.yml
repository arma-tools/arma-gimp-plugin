name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Release
  MINGW_TRIPLET: mingw-w64-clang-x86_64-

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install packages
      run: |
        sudo apt-get update
        sudo apt install -y pkg-config cmake
        sudo apt install -y software-properties-common
        sudo add-apt-repository -y ppa:ubuntuhandbook1/gimp-3
        sudo apt install -y gimp libgimp-3.0-0 libgimp-3.0-dev libgexiv2-dev

    - name: Configure CMake
      run: >
        cmake 
        -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} 
        -DCMAKE_C_COMPILER:FILEPATH=clang 
        -DCMAKE_CXX_COMPILER:FILEPATH=clang++ 
        -S "${{ github.workspace }}"
        -B "${{ github.workspace }}/build/"

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Upload plugin
      uses: actions/upload-artifact@v4
      with:
        name: arma-gimp-plugin
        path: "${{ github.workspace }}/build/arma-gimp-plugin"

  build-windows:
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msys2: clang64
          update: true
          pacboy: >-
            toolchain:p
            cmake:p
            ninja:p
            rust:p
            pkgconf:p
            glib2:p
            gimp:p

# ${{env.MINGW_TRIPLET}}ninja
# ${{env.MINGW_TRIPLET}}clang
# ${{env.MINGW_TRIPLET}}glib2
# ${{env.MINGW_TRIPLET}}pkgconf
# ${{env.MINGW_TRIPLET}}gimp

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        shell: msys2 {0}
        run: >
          cmake 
          -DCMAKE_BUILD_TYPE:STRING=${{env.BUILD_TYPE}} 
          -S "${{ github.workspace }}"
          -B "${{ github.workspace }}/build/"

      - name: Build
        run: cmake --build ${{github.workspace}}\build --config ${{env.BUILD_TYPE}}

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: arma-gimp-plugin
          path: "${{ github.workspace }}/build/arma-gimp-plugin.exe"